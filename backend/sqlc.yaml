version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - column: "postings.salary_amount"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          - column: "postings.salary_usd_annual"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          - column: "postings.fx_rate"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          - db_type: "date"
            nullable: true
            go_type:
              import: "cloud.google.com/go/civil"
              type: "Date"
              pointer: true

x-backend: &backend
  build: ./backend
  image: job-ingestion-and-search-backend
  profiles: [all]

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./volumes/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 20

  migrate:
    <<: *backend
    command: ["migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    <<: *backend
    profiles: [ingest]
    entrypoint: ["ingest"]
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      ELASTICSEARCH_URL: http://elasticsearch:9200
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:?set WORKER_BATCH_SIZE in .env}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:?set WORKER_POLL_INTERVAL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    restart: unless-stopped
    environment:
      API_ADDR: :8080
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: *database-url
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  web:
    build: ./frontend
    profiles: [all]
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

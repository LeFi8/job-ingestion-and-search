name: backend

on:
  push:
    paths:
      - backend/**
      - api/**
      - compose.yaml
      - redocly.yaml
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - api/**
      - compose.yaml
      - redocly.yaml
      - .github/workflows/backend.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: backend
      - name: generated code is current
        run: go generate ./... && git diff --exit-code && test -z "$(git status --porcelain)"
      - run: go tool sqlc vet
      - run: go tool sqlc diff
      - run: npm exec --yes --package=squawk-cli@2.66.0 -- squawk migrations/*.sql
      - run: npm exec --yes --package=@redocly/cli@2.57.0 -- redocly lint api/openapi.yaml
        working-directory: .
      - run: cp .env.example .env && docker compose --profile all config --quiet
        working-directory: .

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -tags integration ./...

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build .
